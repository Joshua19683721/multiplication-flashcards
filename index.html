<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99乘法表閃卡練習</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">

    <!-- 配置Tailwind顏色和字體 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5', // 主色：深紫色
                        secondary: '#EC4899', // 強調色：粉紅色
                        accent: '#F59E0B', // 強調色：橙色
                        dark: '#1F2937',
                        light: '#F3F4F6'
                    },
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .card-container {
                perspective: 1500px; /* 增強透視效果 */
            }
            .card-inner {
                transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                transform-style: preserve-3d;
                position: relative;
                width: 100%;
                height: 100%;
            }
            .card-front, .card-back {
                position: absolute;
                width: 100%;
                height: 100%;
                backface-visibility: hidden; /* 確保背面不可見 */
                -webkit-backface-visibility: hidden;
                overflow: hidden;
            }
            .card-back {
                transform: rotateY(180deg);
            }
            .flipped .card-inner {
                transform: rotateY(180deg);
            }
            .btn-bounce {
                transition: transform 0.2s;
            }
            .btn-bounce:hover {
                transform: translateY(-2px);
            }
            .btn-bounce:active {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-purple-50 min-h-screen font-sans text-dark flex flex-col items-center justify-center p-4">
    <!-- 頁面標題 -->
    <header class="text-center mb-8 mt-4">
        <h1 class="text-[clamp(1.8rem,5vw,3rem)] font-bold text-primary mb-2">99乘法表閃卡練習</h1>
        <p class="text-gray-600 text-lg">點擊卡片查看答案，練習完成後請按「下一題」</p>
    </header>

    <!-- 主要閃卡區域 -->
    <main class="flex-grow flex flex-col items-center justify-center w-full max-w-md">
        <!-- 改進的閃卡容器結構 -->
        <div id="flashcard" class="card-container w-full aspect-square max-w-md mb-10 cursor-pointer shadow-xl rounded-2xl">
            <div class="card-inner">
                <!-- 卡片正面 (題目) -->
                <div class="card-front bg-white rounded-2xl flex flex-col items-center justify-center p-6">
                    <div class="text-5xl md:text-7xl font-bold text-primary transition-all" id="question">3 × 7</div>
                    <p class="mt-6 text-gray-500 text-sm">點擊卡片查看答案</p>
                    <i class="fa fa-refresh text-gray-300 absolute bottom-4 right-4 text-xl animate-pulse"></i>
                </div>

                <!-- 卡片背面 (答案) -->
                <div class="card-back bg-gradient-to-br from-primary to-purple-600 rounded-2xl flex flex-col items-center justify-center p-6 text-white">
                    <div class="text-5xl md:text-7xl font-bold transition-all" id="answer">21</div>
                    <p class="mt-6 text-white/80 text-sm">點擊卡片返回題目</p>
                </div>
            </div>
        </div>

        <!-- 控制按鈕 -->
        <div class="flex flex-col sm:flex-row gap-4 w-full max-w-md">
            <button id="next-btn" class="btn-bounce bg-primary hover:bg-primary/90 text-white font-semibold py-4 px-6 rounded-xl shadow-lg flex-1 flex items-center justify-center">
                <span>下一題</span>
                <i class="fa fa-arrow-right ml-2"></i>
            </button>
            <button id="reset-btn" class="btn-bounce bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-4 px-6 rounded-xl shadow-md flex items-center justify-center">
                <i class="fa fa-refresh mr-2"></i>
                <span>重新開始</span>
            </button>
        </div>
    </main>

    <!-- 頁腳 -->
    <footer class="mt-12 mb-4 text-center text-gray-500 text-sm">
        <p>練習乘法表，提升計算能力 💪</p>
    </footer>

    <script>
        // 乘法題目數據生成
        function generateMultiplicationQuestions() {
            const questions = [];

            // 生成1×1到9×9的所有組合
            for (let a = 1; a <= 9; a++) {
                for (let b = 1; b <= 9; b++) {
                    // 5×5到9×9的題目給予更高權重（出現機率更高）
                    const weight = (a >= 5 && b >= 5) ? 3 : 1;
                    questions.push({
                        a: a,
                        b: b,
                        answer: a * b,
                        weight: weight
                    });
                }
            }

            return questions;
        }

        // 根據權重隨機選擇題目
        function getRandomQuestion(questions) {
            // 建立加權陣列
            const weightedQuestions = [];
            questions.forEach(question => {
                // 根據權重重複加入題目，權重越高出現機率越大
                for (let i = 0; i < question.weight; i++) {
                    weightedQuestions.push(question);
                }
            });

            // 隨機選擇一個題目
            const randomIndex = Math.floor(Math.random() * weightedQuestions.length);
            return weightedQuestions[randomIndex];
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            const flashcard = document.getElementById('flashcard');
            const questionEl = document.getElementById('question');
            const answerEl = document.getElementById('answer');
            const nextBtn = document.getElementById('next-btn');
            const resetBtn = document.getElementById('reset-btn');

            // 生成所有題目
            const allQuestions = generateMultiplicationQuestions();
            let currentQuestion = null;

            // 顯示新題目
            function showNewQuestion() {
                // 如果卡片處於翻轉狀態，先翻回正面
                if (flashcard.classList.contains('flipped')) {
                    flashcard.classList.remove('flipped');
                }

                // 短延遲後顯示新題目，確保翻轉完成
                setTimeout(() => {
                    // 獲取隨機題目
                    currentQuestion = getRandomQuestion(allQuestions);

                    // 更新顯示
                    questionEl.textContent = `${currentQuestion.a} × ${currentQuestion.b}`;
                    answerEl.textContent = currentQuestion.answer;

                    // 添加彈出動畫
                    questionEl.classList.add('scale-110');
                    setTimeout(() => {
                        questionEl.classList.remove('scale-110');
                    }, 300);
                }, 300);
            }

            // 卡片翻轉功能
            flashcard.addEventListener('click', () => {
                flashcard.classList.toggle('flipped');
            });

            // 下一題按鈕
            nextBtn.addEventListener('click', showNewQuestion);

            // 重新開始按鈕
            resetBtn.addEventListener('click', () => {
                // 添加按鈕點擊效果
                resetBtn.classList.add('scale-95');
                setTimeout(() => {
                    resetBtn.classList.remove('scale-95');
                }, 200);

                showNewQuestion();
            });

            // 顯示第一個題目
            showNewQuestion();
        });
    </script>
</body>
</html>
